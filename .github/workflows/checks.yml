name: Validate story
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_release.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/data_adapter.test.cjs
