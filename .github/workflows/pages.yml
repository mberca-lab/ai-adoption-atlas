name: Validate and publish story
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_release.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/data_adapter.test.cjs
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python site/tools/qa.py
        env:
          ATLAS_SCREENSHOTS: '0'
  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    environment:
      name: github-pages
      url: https://mberca.github.io/ai-adoption-atlas/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish validated static snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot=$(git subtree split --prefix=site)
          git push origin "$snapshot:gh-pages"
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
          for attempt in $(seq 1 40); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest")
            status=$(printf '%s' "$result" | jq -r .status)
            commit=$(printf '%s' "$result" | jq -r .commit)
            if [ "$commit" = "$snapshot" ] && [ "$status" = "built" ]; then exit 0; fi
            if [ "$commit" = "$snapshot" ] && [ "$status" = "errored" ]; then
              printf '%s\n' "$result" | jq '{status,error}'
              exit 1
            fi
            sleep 15
          done
          echo "Pages build did not finish in ten minutes."
          exit 1
